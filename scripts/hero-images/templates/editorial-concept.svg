<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1600" viewBox="0 0 3200 1600">
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; }
    .meta { font-size: 42px; font-weight: 650; letter-spacing: 10px; }
    .primary { font-size: 300px; font-weight: 800; letter-spacing: -10px; }
    .secondary { font-size: 190px; font-weight: 750; letter-spacing: -4px; }
    .descriptor { font-size: 58px; font-weight: 700; letter-spacing: 9px; }
    .footer { font-size: 48px; font-weight: 650; letter-spacing: 15px; }
  </style>
  <rect width="3200" height="1600" fill="{{BACKGROUND}}"/>
  <text x="224" y="122" class="meta" fill="{{TEXT}}">{{KICKER}}</text>
  <text x="2976" y="122" class="meta" text-anchor="end" fill="{{TEXT}}">{{SOURCE}}</text>
  <text x="224" y="660" class="primary" fill="{{TEXT}}">{{PRIMARY}}</text>
  <text x="224" y="900" class="secondary" fill="{{TEXT}}">{{SECONDARY}}</text>
  <line x1="224" y1="1020" x2="980" y2="1020" stroke="{{ACCENT}}" stroke-width="8"/>
  <text x="224" y="1135" class="descriptor" fill="{{TEXT}}">{{DESCRIPTOR}}</text>
  <text x="224" y="1385" class="footer" fill="{{MUTED}}">{{FOOTER}}</text>
  <g fill="none" transform="translate(2320 800)">
    <rect x="-520" y="-520" width="1040" height="1040" stroke="{{LINE}}" stroke-width="5"/>
    <rect x="-400" y="-400" width="800" height="800" stroke="{{LINE}}" stroke-width="5" transform="rotate(8)"/>
    <rect x="-280" y="-280" width="560" height="560" stroke="{{ACCENT}}" stroke-width="8" transform="rotate(16)"/>
    <rect x="-150" y="-150" width="300" height="300" stroke="{{TEXT}}" stroke-width="5" transform="rotate(24)"/>
  </g>
  <text x="2320" y="1510" class="meta" text-anchor="middle" fill="{{MUTED}}">{{ANNOTATION}}</text>
</svg>
