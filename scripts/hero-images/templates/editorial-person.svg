<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1600" viewBox="0 0 3200 1600">
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; }
    .meta { font-size: 42px; font-weight: 650; letter-spacing: 10px; }
    .primary { font-size: 330px; font-weight: 800; letter-spacing: -12px; }
    .secondary { font-size: 330px; font-weight: 800; letter-spacing: -12px; }
    .descriptor { font-size: 66px; font-weight: 700; letter-spacing: 8px; }
    .footer { font-size: 46px; font-weight: 650; letter-spacing: 14px; }
    .annotation { font-size: 36px; font-weight: 650; letter-spacing: 8px; }
  </style>
  <rect width="3200" height="1600" fill="{{BACKGROUND}}"/>
  <text x="224" y="122" class="meta" fill="{{TEXT}}">{{KICKER}}</text>
  <text x="2976" y="122" class="meta" text-anchor="end" fill="{{TEXT}}">{{SOURCE}}</text>
  <text x="224" y="680" class="primary" fill="{{TEXT}}">{{PRIMARY}}</text>
  <text x="224" y="1040" class="secondary" fill="{{TEXT}}">{{SECONDARY}}</text>
  <line x1="1820" y1="310" x2="1820" y2="1300" stroke="{{ACCENT}}" stroke-width="9"/>
  <text x="1950" y="620" class="descriptor" fill="{{TEXT}}">{{DESCRIPTOR}}</text>
  <text x="1950" y="760" class="annotation" fill="{{MUTED}}">{{ANNOTATION}}</text>
  <line x1="1950" y1="850" x2="2800" y2="850" stroke="{{LINE}}" stroke-width="5"/>
  <text x="1950" y="980" class="footer" fill="{{TEXT}}">{{FOOTER}}</text>
</svg>
